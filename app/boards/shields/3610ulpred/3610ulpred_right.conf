CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
# CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y

# NFC pins as GPIO (regular XIAO, needed for RST on P0.10): NOT set here.
# CONFIG_NFCT_PINS_AS_GPIOS is DEPRECATED in Zephyr 4.1; the equivalent is the
# devicetree property  &uicr { nfct-pins-as-gpios; }  in 3610ulpred_right.overlay.
# CONFIG_NFCT_PINS_AS_GPIOS=y

CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_I2C=y
# CONFIG_INPUT_PINNACLE=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_USB=y

# Central role + name are also defaulted by Kconfig.defconfig; kept here
# explicitly as well, mirroring 369ulptp.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_KEYBOARD_NAME="3610ulpred"

# PS/2 TrackPoint (kb_zmk_ps2_mouse_trackpoint_driver): cap report rate for BLE
# CONFIG_ZMK_INPUT_MOUSE_PS2_REPORT_INTERVAL_MIN=12
